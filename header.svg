<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1613"/>
      <stop offset="100%" stop-color="#100d0b"/>
    </linearGradient>
    <linearGradient id="areafill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFB991" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#CFB991" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: warm near-black, not the generic purple-dark -->
  <rect width="900" height="200" fill="url(#bgfade)"/>

  <!-- Name -->
  <text x="50" y="92" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F5F0E6">Khoi Mai</text>

  <!-- Subtitle, sentence case, no tracking -->
  <text x="50" y="122" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#CFB991">Data scientist studying CS &amp; Data Science at Purdue</text>
  <text x="50" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8a8178">Love challenges</text>

  <!-- Divider -->
  <line x1="565" y1="45" x2="565" y2="155" stroke="#CFB991" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Baseline for the chart -->
  <line x1="605" y1="158" x2="852" y2="158" stroke="#CFB991" stroke-opacity="0.18" stroke-width="1"/>

  <!-- A single real graphic moment: a forecast/convergence curve, not fake scatter -->
  <path d="M605,150 C650,132 680,128 715,112 S 790,62 850,48 L850,158 L605,158 Z" fill="url(#areafill)"/>
  <path d="M605,150 C650,132 680,128 715,112 S 790,62 850,48" fill="none" stroke="#CFB991" stroke-width="2"/>

  <!-- Endpoint marker -->
  <circle cx="850" cy="48" r="4" fill="#CFB991"/>
  <circle cx="850" cy="48" r="8" fill="none" stroke="#CFB991" stroke-opacity="0.4" stroke-width="1"/>
</svg>
